title: 'PowerShell Download Cradle'
id: 23edc06e-5ae4-5d37-a6d7-b1a5827b7dda
status: experimental
description: 'Script PowerShell qui telecharge du contenu distant par Net.WebClient (Event 4104 : DownloadString, DownloadFile, DownloadData), motif des chargeurs en memoire ; Invoke-WebRequest et Start-BitsTransfer, courants en administration, ne sont pas retenus'
author: Phoenix DFIR
tags:
    - attack.command-and-control
    - attack.t1105
logsource:
    product: windows
detection:
    selection:
        EventID: 4104
        ScriptBlockText|contains:
            - 'DownloadString'
            - 'DownloadFile'
            - 'DownloadData'
    condition: selection
level: high
phoenix_id: phoenix-powershell-download-cradle
