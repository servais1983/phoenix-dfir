version: "3.8"

# Production stack: Phoenix DFIR + Redis + Nginx reverse proxy.
# Copy .env.example to .env and set PHOENIX_SECRET_KEY (required).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  phoenix-dfir:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DFIR_TOOLS: "${PHOENIX_INSTALL_DFIR_TOOLS:-true}"
    image: phoenix-dfir:${PHOENIX_VERSION:-4.17.0}
    container_name: phoenix-dfir
    restart: unless-stopped
    # gunicorn gthread worker (same as the image CMD), kept explicit here
    command: ["gunicorn", "--config", "/app/backend/gunicorn.conf.py", "app:app"]
    expose:
      - "5000"
    environment:
      PHOENIX_SECRET_KEY: ${PHOENIX_SECRET_KEY:?PHOENIX_SECRET_KEY is required}
      PHOENIX_ENV: production
      PHOENIX_DEBUG: "false"
      # nginx is the single trusted proxy: X-Forwarded-For / -Proto are honored
      # for exactly one hop (rate limiting by real client IP, Secure cookie).
      PHOENIX_TRUSTED_PROXIES: ${PHOENIX_TRUSTED_PROXIES:-1}
      # Accounts: self-registration closed by default; initial admin from env
      # or a one-time setup token printed in the container logs.
      PHOENIX_ALLOW_REGISTRATION: ${PHOENIX_ALLOW_REGISTRATION:-false}
      PHOENIX_ADMIN_USERNAME: ${PHOENIX_ADMIN_USERNAME:-}
      PHOENIX_ADMIN_PASSWORD: ${PHOENIX_ADMIN_PASSWORD:-}
      PHOENIX_COOKIE_SECURE: ${PHOENIX_COOKIE_SECURE:-false}
      PHOENIX_MAX_JOBS_PER_USER: ${PHOENIX_MAX_JOBS_PER_USER:-2}
      # Durable job queue (SQLite) worker threads, and gunicorn gthread threads
      PHOENIX_JOB_WORKERS: ${PHOENIX_JOB_WORKERS:-2}
      PHOENIX_THREADS: ${PHOENIX_THREADS:-64}
      # Optional bearer token for /metrics (empty = public, nginx restricts it)
      PHOENIX_METRICS_TOKEN: ${PHOENIX_METRICS_TOKEN:-}
      PHOENIX_ACCESS_TOKEN_EXPIRY: ${PHOENIX_ACCESS_TOKEN_EXPIRY:-900}
      PHOENIX_REFRESH_TOKEN_EXPIRY: ${PHOENIX_REFRESH_TOKEN_EXPIRY:-604800}
      PHOENIX_PBKDF2_ITERATIONS: ${PHOENIX_PBKDF2_ITERATIONS:-600000}
      PHOENIX_LOG_LEVEL: ${PHOENIX_LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379/0
      # LLM, local first: ollama (default) | llamacpp | lmstudio | jan | auto (local only)
      PHOENIX_LLM_PROVIDER: ${PHOENIX_LLM_PROVIDER:-ollama}
      PHOENIX_LLAMACPP_URL: ${PHOENIX_LLAMACPP_URL:-http://host.docker.internal:8080/v1}
      PHOENIX_LMSTUDIO_URL: ${PHOENIX_LMSTUDIO_URL:-http://host.docker.internal:1234/v1}
      PHOENIX_LMSTUDIO_MODEL: ${PHOENIX_LMSTUDIO_MODEL:-}
      PHOENIX_JAN_URL: ${PHOENIX_JAN_URL:-http://host.docker.internal:1337/v1}
      PHOENIX_JAN_MODEL: ${PHOENIX_JAN_MODEL:-}
      PHOENIX_JAN_API_KEY: ${PHOENIX_JAN_API_KEY:-}
      PHOENIX_LLM_SEED: ${PHOENIX_LLM_SEED:-42}
      # Cloud LLM (openai | github) is refused unless PHOENIX_ALLOW_CLOUD_LLM=1
      PHOENIX_ALLOW_CLOUD_LLM: ${PHOENIX_ALLOW_CLOUD_LLM:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PHOENIX_OPENAI_MODEL: ${PHOENIX_OPENAI_MODEL:-gpt-4o-mini}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PHOENIX_GITHUB_MODEL: ${PHOENIX_GITHUB_MODEL:-openai/gpt-4o-mini}
      PHOENIX_STRICT_EVIDENCE: ${PHOENIX_STRICT_EVIDENCE:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      PHOENIX_OLLAMA_MODEL: ${PHOENIX_OLLAMA_MODEL:-qwen2.5-coder:14b}
      # Frontend origins behind nginx (REQUIRED for WebSocket):
      # e.g. https://phoenix.mon-soc.local ou http://10.0.0.5
      PHOENIX_CORS_ORIGINS: ${PHOENIX_CORS_ORIGINS:-}
    volumes:
      - phoenix-data:/app/data
      - phoenix-uploads:/app/backend/uploads
      - phoenix-reports:/app/backend/reports
      - phoenix-inbox:/app/backend/evidence_inbox
      # Evidence vault, READ-ONLY
      - ${PHOENIX_EVIDENCE_VAULT_HOST:-./evidence_vault}:/mnt/evidence:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:5000/readyz', timeout=3).read(); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false  # backend writes to /app/data
    networks:
      - phoenix-net
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: phoenix-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "3600 1 300 100 60 10000"
    volumes:
      - phoenix-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - phoenix-net
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    container_name: phoenix-nginx
    restart: unless-stopped
    depends_on:
      phoenix-dfir:
        condition: service_healthy
    ports:
      - "${PHOENIX_HTTP_PORT:-80}:80"
      - "${PHOENIX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - phoenix-net
    logging: *default-logging

networks:
  phoenix-net:
    driver: bridge

volumes:
  phoenix-data:
    driver: local
  phoenix-uploads:
    driver: local
  phoenix-reports:
    driver: local
  phoenix-inbox:
    driver: local
  phoenix-redis-data:
    driver: local
